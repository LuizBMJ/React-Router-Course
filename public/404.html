<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting…</title>
    <script>
      var base = '/React-Router-Course'
      var rest = window.location.pathname.slice(base.length)
      window.location.replace(base + '/#' + (rest || '/') + window.location.search)
    </script>
  </head>
  <body>
    <p>Redirecting…</p>
  </body>
</html>
